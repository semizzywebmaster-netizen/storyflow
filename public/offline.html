
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - AI Story Studio</title>
<style>
body { font-family: system-ui; background: #0a0a0f; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
.card { background: #1a1a2e; border-radius: 16px; padding: 32px; max-width: 400px; text-align: center; }
h1 { margin: 0 0 12px; }
p { color: #a1a1aa; line-height: 1.5; }
button { background: #7c3aed; color: white; border: 0; padding: 12px 24px; border-radius: 12px; font-weight: 600; margin-top: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
<h1>You're offline</h1>
<p>AI Story Studio needs internet for AI generation. Your local drafts are saved and will sync when you reconnect.</p>
<p style="font-size: 13px; margin-top: 16px;">You can still view recent projects and drafts offline.</p>
<button onclick="window.location.reload()">Try Again</button>
<button onclick="window.location.href='/'" style="background: transparent; border: 1px solid #333; margin-left: 8px;">Go Home</button>
</div>
</body>
</html>
